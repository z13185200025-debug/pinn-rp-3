[project]
name = "pinn-rp3"
version = "0.1.0"
description = "Deep learning and physics-informed neural networks for RP-3 vertical tube heat transfer deterioration prediction."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "torch>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "joblib>=1.3",
  "pyarrow>=12.0",
  "scipy>=1.10",
  "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
